name: Release validation

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate package release surface
        run: pnpm run validate

      - name: Audit package dependencies
        run: pnpm audit

  telemetry-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: telemetry/pnpm-lock.yaml

      - name: Install telemetry worker
        working-directory: telemetry
        run: pnpm install --frozen-lockfile

      - name: Validate telemetry worker
        working-directory: telemetry
        run: pnpm run validate

      - name: Audit telemetry dependencies
        working-directory: telemetry
        run: pnpm audit
