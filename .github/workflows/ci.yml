name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.13.0'

      - name: Activate pinned pnpm
        run: |
          npm install -g corepack@0.34.7
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Restore pnpm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm run validate

      - name: Audit dependencies
        run: pnpm run audit:deps

  telemetry-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.13.0'

      - name: Activate pinned pnpm
        run: |
          npm install -g corepack@0.34.7
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Restore telemetry pnpm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: telemetry/pnpm-lock.yaml

      - name: Install telemetry worker
        working-directory: telemetry
        run: pnpm install --frozen-lockfile

      - name: Validate telemetry worker
        working-directory: telemetry
        run: pnpm run validate

      - name: Audit telemetry dependencies
        run: node scripts/audit/dependency-audit.mjs --workspace telemetry

  odin-say:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/odin-say
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Rust (crate toolchain 1.88.0)
        uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  # Charter check (pattern C, template v3). Non-required, so a red charter job
  # never blocks a merge; honest, so it never reports success for a check it did
  # not run. While the charter source is unreachable from this runner the probe
  # FAILS the job as "charter NOT CHECKED" (an error annotation and a NOT CHECKED
  # step summary), because v2's green on that path checked nothing. When the
  # source is reachable it installs the pinned commit and enforces
  # `check --strict` with no edit here. Local hooks and the pre-push
  # `check --strict` enforce Charter meanwhile.
  charter:
    name: charter (non-required; fails as NOT CHECKED while the charter source is unreachable)
    runs-on: ubuntu-latest
    env:
      CHARTER_REV: cf05eb5c9a1f1768d7aed8edee087e992bd9ad16
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0  # strict checks that STATE's recorded HEAD exists
      - name: probe the charter source
        id: probe
        run: |
          if GIT_TERMINAL_PROMPT=0 git -C "$RUNNER_TEMP" ls-remote --exit-code https://github.com/bradheitmann/charter HEAD >/dev/null 2>&1; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::error title=charter NOT CHECKED::charter source unreachable from this runner; nothing was checked"
            echo "charter NOT CHECKED: the charter source is unreachable from this runner, so no charter check ran. This job is non-required: it is red to say the check did not happen, not to block a merge." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - if: steps.probe.outputs.reachable == 'true'
        uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759  # 1.88.0
        with:
          toolchain: 1.88.0
      - if: steps.probe.outputs.reachable == 'true'
        name: charter check --strict at the pinned commit
        run: |
          cargo +1.88.0 install --locked --git https://github.com/bradheitmann/charter --rev "$CHARTER_REV" charter
          charter --version | grep -F "($CHARTER_REV)"
          charter check --strict
