name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'

      - name: Activate pinned pnpm
        run: |
          npm install -g corepack@0.34.7
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Restore pnpm cache
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm run validate

      - name: Audit dependencies
        run: pnpm audit

  telemetry-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'

      - name: Activate pinned pnpm
        run: |
          npm install -g corepack@0.34.7
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Restore telemetry pnpm cache
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: telemetry/pnpm-lock.yaml

      - name: Install telemetry worker
        working-directory: telemetry
        run: pnpm install --frozen-lockfile

      - name: Validate telemetry worker
        working-directory: telemetry
        run: pnpm run validate

      - name: Audit telemetry dependencies
        working-directory: telemetry
        run: pnpm audit
