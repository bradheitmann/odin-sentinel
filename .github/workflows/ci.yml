name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.13.0'

      - name: Activate pinned pnpm
        run: |
          npm install -g corepack@0.34.7
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Restore pnpm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm run validate

      - name: Audit dependencies
        run: pnpm run audit:deps

  telemetry-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.13.0'

      - name: Activate pinned pnpm
        run: |
          npm install -g corepack@0.34.7
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Restore telemetry pnpm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: telemetry/pnpm-lock.yaml

      - name: Install telemetry worker
        working-directory: telemetry
        run: pnpm install --frozen-lockfile

      - name: Validate telemetry worker
        working-directory: telemetry
        run: pnpm run validate

      - name: Audit telemetry dependencies
        run: node scripts/audit/dependency-audit.mjs --workspace telemetry
