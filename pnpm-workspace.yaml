allowBuilds:
  esbuild: true

# Pin patched versions of transitive dependencies pulled through
# @modelcontextprotocol/sdk's HTTP transport stack.
#
# The advisories each pin covers, their owner, their review-by date, and the
# rationale are recorded in scripts/audit/audit-exceptions.json, which
# `pnpm run audit:deps` validates before it audits. That gate fails on an
# expired or malformed record and on a pin recorded here that has drifted from
# the manifest, so no pin survives on a free-text comment alone.
overrides:
  ip-address: "^10.1.1"
  hono: "^4.12.18"
  qs: "^6.15.2"
