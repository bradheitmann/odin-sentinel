session_id: "<session-id>"
topology:
  mode: "governed-team"
  cmux_required: true
  cmux_workspace: "<workspace-ref>"
  layout: "human-readable spatial/pod organization"
executive_office:
  - "A/EXEC-PM"
  - "A/EXEC-ODIN"
  - "A/EXEC-ASST"
development_pods:
  - "B"
odin_mesh:
  cadence_seconds: 30
  executive_odin: "A/EXEC-ODIN"
  team_odins:
    - "B/ODIN"
model_profile:
  minimum_compatible_child_mcp_version: "0.4.5"
  inference_provider_inventory: []
handoff_sources:
  - "<handoff path or none>"
startup_objectives:
  - "<plain-language objective>"
role_slots:
  - role_slot: "A/EXEC-PM"
    harness: "<harness>"
    readiness_status: "PASS"
    layout_locator:
      workspace: "<workspace-ref>"
      pane: "<pane-ref>"
      surface: "<surface-ref>"
    scp_context_source: "native odin-scp skill"
    mcp_available: true
    mcp_version: "0.4.5"
    scp_skill_available: true
    full_protocol_text_injected: false
    watcher: "A/EXEC-ODIN"
  - role_slot: "A/EXEC-ODIN"
    harness: "<harness>"
    readiness_status: "PASS"
    layout_locator:
      workspace: "<workspace-ref>"
      pane: "<pane-ref>"
      surface: "<surface-ref>"
    scp_context_source: "native odin-scp skill"
    mcp_available: true
    mcp_version: "0.4.5"
    scp_skill_available: true
    full_protocol_text_injected: false
    watches:
      - "A/EXEC-PM"
      - "B/ODIN"
  - role_slot: "B/ODIN"
    harness: "<harness>"
    readiness_status: "PASS"
    layout_locator:
      workspace: "<workspace-ref>"
      pane: "<pane-ref>"
      surface: "<surface-ref>"
    scp_context_source: "native odin-scp skill"
    mcp_available: true
    mcp_version: "0.4.5"
    scp_skill_available: true
    full_protocol_text_injected: false
    watches:
      - "B/TEAM-PM"
      - "B/DEV-1"
  - role_slot: "B/DEV-1"
    harness: "<harness>"
    readiness_status: "PASS"
    layout_locator:
      workspace: "<workspace-ref>"
      pane: "<pane-ref>"
      surface: "<surface-ref>"
    scp_context_source: "native odin-scp skill"
    mcp_available: true
    mcp_version: "0.4.5"
    scp_skill_available: true
    full_protocol_text_injected: false
    watcher: "B/ODIN"
fallback_policy:
  non_governed_one_shot_only: "Allowed only for bounded, non-persistent help when MCP/skill/protocol proof is absent. Not suitable for a persistent governed role."
operator_friendly_status:
  summary: "<what is happening in one sentence>"
  current_blocker: "<sign-in | permission prompt | API/account setup | local model smoke test | none>"
  safe_next_choice: "<approve | sign in | choose fallback harness | keep slot vacant | ask for help>"
user_defined_criteria:
  - "<project-specific criterion>"

