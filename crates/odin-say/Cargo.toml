[package]
name = "odin-say"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "ODIN CMUX delivery sender: read the pane, refuse busy/blocked panes, send one line, verify, log a proof record"
license = "MIT"
publish = false

[lib]
name = "odin_say"
path = "src/lib.rs"

[[bin]]
name = "odin-say"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
strip = true
