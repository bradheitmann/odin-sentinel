version: 0.5.0
delegation_contract:
  required_fields:
    - receipt_type
    - source_role
    - target_role_slot
    - task
    - scope
    - authority
    - report_back
    - visibility
  authority_fields:
    - may_implement
    - may_qa_accept
    - write_scope
    - read_scope
    - prohibited_paths
  visibility_fields:
    - requires_visible_role_slot
    - hidden_agents_allowed
    - delivery_proof_required
  receipt_types:
    - SCP-DELEGATE
    - SCP-TERMINAL-DELIVERY
    - SCP-CMUX-DELIVERY
    - SCP-COORDINATION
  delivery_states:
    - DELIVERED_ACKED
    - DELIVERED_NO_ACK
    - INPUT_BAR_ONLY
    - PANE_BLOCKED_ON_PERMISSION
    - PANE_STILL_THINKING
  delivery_proof_fields:
    - target_surface_locator
    - submitted
    - verification_method
    - observed_processing_state
    - timestamp
    - sender_role
  delivery_proof_policy:
    required_for: governed-team CMUX dispatch
    confirmed_states:
      - DELIVERED_ACKED
      - DELIVERED_NO_ACK
    rule: A dispatch is delivered only after submit (Enter) plus verified processing on the target surface; input-bar text is not delivery.
    validate_with: odin.validate_cmux_delivery_proof
  step_up_ladder_mode:
    description: >-
      Delegation mode for capability-tiered remediation (odin://protocol/step-up-ladder).
      Routes a gate-failed artifact UP one tier for REWORK, never restart. PM-routed,
      readiness-gated, liveness-checked.
    required_fields:
      - failed_artifact_paths    # non-empty; the salvaged baton
      - failure_reason           # the exact gate finding that failed the prior tier
      - failed_gate              # QA_REJECT | HOLDOUT_FAIL | SELF_PROOF_GAP
      - acceptance_bar           # UNCHANGED from the original assignment
      - source_tier_index
      - target_tier_index        # source + 1
      - review_lane_tier_index   # must equal target_tier_index (independence travels with the DEV)
    rules:
      - Step up only on a real, independent gate failure; a self-authored tool green never justifies escalation state.
      - The receiving tier opens and continues the salvaged artifact; an empty failed_artifact_paths is an invalid restart.
      - The acceptance bar is immutable across tiers.
      - The receiving tier is reviewed by its OWN QA + holdout lane, never the prior tier's lane.
      - Never dispatch into an unready, saturated, or drifting lane; hold and surface instead.
      - Validate packets with odin.validate_remediation_packet; evaluate gates with odin.evaluate_escalation_gate.
  commit_gate_exec_mode:
    description: >-
      Exec-gated commit (commit_gate: exec): the pod stages and obtains
      independent QA (STAGED-READY); the EXEC independently verifies ground
      truth and issues a COMMIT-AUTHORIZED token; the DEV commits; the EXEC
      re-verifies the landed commit. Resource: odin://protocol/commit-gate.
    state_sequence: [STAGED_READY, EXEC_VERIFIED, COMMIT_AUTHORIZED, COMMITTED, EXEC_REVERIFIED]
    rules:
      - A PM cannot authorize its own pod's commit.
      - The token is issued only by an EXEC-layer seat after independent ground-truth verification.
      - A landed commit without EXEC re-verification is not closure-eligible.
      - Validate records with odin.validate_commit_gate.
  rules:
    - Delegation must target a visible role slot.
    - A closure claim requires an independent QA emission; validate with odin.validate_closure_independence.
    - Delegation must not create hidden agents or off-ledger workers.
    - Delegation must include exact authority and scope.
    - Terminal text left in an input bar is not delivery.
    - QA acceptance cannot be delegated to the same role that implemented the deliverable.
    - Staffing actions (spawn, rename, kill, reassign, move-surface) are the sole authority of A/EXEC-PM and may not be delegated to TEAM PMs or workers.
    - Surface custodianship (new-split, new-surface, move-surface, close-surface) is held exclusively by A/EXEC-PM.
    - TEAM PMs needing more staff must escalate to A/EXEC-PM rather than act.
