delivery_verification_tiers:
  - tier: scrollback_grep
    description: "grep deep scrollback for the message marker (primary for scrollback-capable harnesses)"
  - tier: timed_reread
    description: "read the screen again after a bounded delay (weaker second pass)"
  - tier: behavioral
    description: "screen advanced vs pre-send snapshot AND message head absent from input bar (MANDATORY for alt-screen TUIs with no scrollback)"

alt_screen_rule: >-
  Alt-screen TUIs with no scrollback (Crush) make marker-grep structurally
  unreliable — the behavioral tier is MANDATORY there; marker-grep may never be
  the sole verification method for an alt-screen surface.
