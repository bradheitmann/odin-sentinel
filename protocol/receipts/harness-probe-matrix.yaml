version: 0.6.0
# Registry mode: typed events are authority; this document is transport.
# Harness Probe Matrix Receipt — EPIC-028 / STORY-GOVTRUTH-R4
# Per-harness control recipes surfaced through the odin.get_harness_probe_matrix
# tool output. Control recipes are probe-visible (inline in each matrix row) so
# a probe consumer sees quit_verb / model_set_recipe / control_recipe without a
# second resource read.
#
# SOURCE OF TRUTH: protocol/resources/harness-control-matrix.yaml is the sole
# source of harness recipe data (STORY-GOVTRUTH-R4). This receipt MIRRORS those
# entries; a parity test (tests/protocol/harness-control-matrix.test.ts) fails
# on any membership or value drift between the two, in either direction.
#
# Identity: `harness_id` is the canonical snake_case machine id; `display_name`
# is an explicit field, never an inferred transform of the id. Entries with
# `verified: false` carry NO version_pin (unverified recipes are never
# presented as pinned) and their recipes are best-effort defaults.
# All recipes are ARROW-FREE: type-ahead, mnemonic keys, or launch flags only.

harnesses:
  - harness_id: claude_code
    display_name: "Claude Code"
    verified: true
    version_pin: "2.1.170+"
    submit_profile: double_enter
    newline_policy: preserve
    control_recipe: "clear-before-send: ctrl+u then read-screen; quit: /exit; model: /model (global, set last or --model flag)"
    quit_verb: "/exit"
    model_set_recipe: "/model <name> (type-ahead; model/effort default is GLOBAL per instance — set in-session LAST or use --model flag)"
    effort_set_recipe: "/effort <level> (type-ahead; global)"
    open_menu_recipe: "type-ahead slash commands: /model, /effort, /exit"
    relaunch_recipe: "relaunch with --model <name> launch flag; re-verify model from the status bar"
    notes: "model/effort is GLOBAL across instances; set in-session LAST or use --model flag"

  - harness_id: droid
    display_name: "Droid"
    verified: true
    version_pin: "0.144.2+"
    submit_profile: double_enter
    newline_policy: preserve
