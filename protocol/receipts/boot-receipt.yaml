required_fields:
  - role
  - authority_layer
  - team
  - terminal_locator
  - branch
  - cwd
  - model_harness
  - permission_mode
  - may_implement
  - may_qa_accept
  - reports_to
  - write_scope
  - evidence_path
  - current_task
receipt_types:
  - SCP_BOOT_RECEIPT
  - SCP_MIN_BOOT_RECEIPT
minimum_compatible_mcp_version: 0.4.5
field_types:
  role: string
  authority_layer: string
  team: string
  terminal_locator: string
  branch: string
  cwd: string
  model_harness: string
  permission_mode: string
  may_implement: boolean
  may_qa_accept: boolean
  reports_to: string
  write_scope: string_array
  evidence_path: string
  current_task: string
write_scope_policy:
  empty_array_valid_for:
    - no current write assignment
    - may_implement false roles
    - DEV roles in BOOTSTRAPPED_IDLE before assignment
  null_policy: invalid; use [] for unassigned scope
allowed_lifecycle_states:
  - SURFACE_PROVISIONED
  - BOOTSTRAPPED_IDLE
  - ACTIVE_WATCH
  - VACANT_ROLE_SLOT
  - AGENT_SUBSTITUTION_REQUIRED
  - RELEASED_BY_OPERATOR
  - HANDED_OFF
  - PARKED_IDLE
  - FAILED
  - WATCH_UNSUPPORTED
optional_extension_fields:
  scp_skill_sha256:
    type: string
    required: false
    description: "SHA-256 of bootstrap-skill.md at session boot; used for hash-pinned re-arm"
  role_card_sha256:
    type: string
    required: false
    description: "SHA-256 of role card content at session boot"
  harness_id:
    type: string
    required: false
    description: "Harness identifier: cmux | tmux | crush | glm-droid | minimux | herdr | plain"
recommended_fields:
  - upstream
  - head_sha
  - cost_tier
  - capability_profile
  - delegates_to
  - prohibited_paths
  - proof_source
  - lifecycle_state
  - mcp_version
  - scp_context_source
  - instruction_read_proof
conditionally_required_fields:
  condition: team != "A"
  fields:
    - staffed_by
    - parent_surface_ref
    - column_index
    - team_letter
  note: >-
    Required, not recommended, for any role outside the executive office. A
    reader following required_fields alone must also apply this block; the
    validator hard-fails non-exec receipts that omit these fields.
receipt_type_policy:
  SCP_BOOT_RECEIPT: full governed occupant receipt after role/context/readiness are known
  SCP_MIN_BOOT_RECEIPT: minimal bootstrap-only receipt for orientation or pre-dispatch identity proof
staffing_audit:
  description: >-
    For any role outside the executive office (team != "A"), the boot receipt
    must record who staffed the agent (staffed_by) and which CMUX surface it
    occupies (parent_surface_ref, column_index, team_letter). Receipts missing
    these fields on non-exec roles are INVALID (hard validation failure, not a
    warning), and a staffed_by other than the canonical staffing authority is
    invalid and halt-eligible. EXEC PM is the sole canonical staffing authority.
  required_for_non_exec_team:
    - staffed_by
    - parent_surface_ref
    - column_index
    - team_letter
  staffed_by_canonical_value: A/EXEC-PM
instruction_read_proof_policy:
  required_before:
    - implementation
    - QA acceptance
    - ACTIVE_WATCH
  per_file_fields:
    - path
    - bytes_or_lines
    - sha256
  description: >-
    Activated roles must produce a full-instruction-read proof before acting. Each required
    instruction file is recorded with a byte or line count and a SHA-256 digest; first-screen
    or partial reads are insufficient. Verify with scripts/protocol/verify-instruction-read.mjs
    and validate shape with odin.validate_instruction_read_proof.
  non_breaking: >-
    This is a recommended, non-breaking addition. Existing receipts without an
    instruction_read_proof field remain valid.
