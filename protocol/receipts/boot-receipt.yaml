required_fields:
  - role
  - authority_layer
  - team
  - terminal_locator
  - branch
  - cwd
  - model_harness
  - permission_mode
  - may_implement
  - may_qa_accept
  - reports_to
  - write_scope
  - evidence_path
  - current_task
recommended_fields:
  - upstream
  - head_sha
  - cost_tier
  - capability_profile
  - delegates_to
  - prohibited_paths
  - proof_source
  - staffed_by
  - parent_surface_ref
  - column_index
  - team_letter
staffing_audit:
  description: >-
    For any role outside the executive office (team != "A"), the boot receipt
    must record who staffed the agent (staffed_by) and which CMUX surface it
    occupies (parent_surface_ref, column_index, team_letter). Receipts missing
    these fields on non-exec roles produce ODIN warnings. EXEC PM is the sole
    canonical staffing authority.
  required_for_non_exec_team:
    - staffed_by
    - parent_surface_ref
    - column_index
    - team_letter
  staffed_by_canonical_value: A/EXEC-PM
