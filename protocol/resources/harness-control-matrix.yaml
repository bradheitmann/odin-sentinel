version: 0.5.0
harness_control_matrix:
  doctrine: >-
    Driving heterogeneous harnesses through a terminal multiplexer requires
    version-pinned, ARROW-FREE keystroke recipes: arrow/nav key tokens are
    unusable through cmux send-key (every spelling returns invalid_params), and
    raw arrow escape sequences cancel menus or leak literal text into prompts.
    Field origin: cmux harness-control SOP (2026-06-12), 9 verified fail-states.

  recipe_rules:
    - Every recipe is pinned to a harness version; recipes are re-verified on upgrade.
    - No recipe may contain arrow or nav-key tokens (Up/Down/Left/Right/Home/End/PageUp/PageDown)
      or raw escape sequences; menus are driven by type-ahead, mnemonic keys, or launch flags.
    - Clear-before-send is mandatory (ctrl+u, then read-screen) — send APPENDS to the input
      bar, it does not replace it.
    - Quit uses the harness's in-app quit verb, never ctrl+c.
    - Probe new recipes on a disposable surface, never a live role slot.
  recipe_validate_with: odin.validate_control_recipe

  fail_state_guardrails:
    - "FAIL-1: send appends, never replaces - always ctrl+u + read-screen before Enter."
    - "FAIL-2: raw arrow escape sequences cancel menus / leak literal text - never send them."
    - "FAIL-3: no arrow token exists in send-key - every spelling fails invalid_params."
    - "FAIL-4: ctrl+c does not quit - use the in-app quit verb."
    - "FAIL-5: type-ahead can be dead in some menus and default focus varies per model."
    - "FAIL-6: Claude Code model/effort 'default' is GLOBAL, not per-session - last writer wins across instances; set in-session LAST, use a --model launch flag, or the session-only menu path."
    - "FAIL-7: permission/yolo modes may not persist across relaunch - re-apply session state."
    - "FAIL-8: relaunch can reset the model to the harness default - re-verify from the status bar (composes the fallback-contract post-relaunch verify)."
    - "FAIL-9: stray probe keystrokes into the wrong or idle pane - verify the target locator before every probe."

  matrix_entry_fields:
    - harness_id
    - version_pin           # exact version the recipes were verified against
    - open_menu_recipe
    - model_set_recipe
    - effort_set_recipe
    - quit_verb
    - relaunch_recipe
    - notes

  # EPIC-028 concrete harness entries (version-pinned, arrow-free). These carry
  # the real data the matrix describes; `version_pin` is the canonical schema
  # field and `harness_version` is its alias on the validateHarnessControlRecipe /
  # holdout validator surface. The `+` floor means "verified at this release;
  # re-verify on upgrade" — it is a real pin, not a `latest`/`any` placeholder.
  field_aliases:
    harness_version: version_pin   # holdout / validateHarnessControlRecipe surface
  harnesses:
    - harness_id: claude_code
      version_pin: "2.1.170+"
      harness_version: "2.1.170+"
      quit_verb: "/exit"
      open_menu_recipe: "type-ahead slash commands: /model, /effort, /exit"
      model_set_recipe: "/model <name> (type-ahead; model/effort default is GLOBAL per instance — set in-session LAST or use --model flag)"
      effort_set_recipe: "/effort <level> (type-ahead; global)"
      relaunch_recipe: "relaunch with --model <name> launch flag; re-verify model from the status bar"
      control_recipe: "clear-before-send: ctrl+u then read-screen; quit: /exit; model: /model (global, set last or --model flag)"
      submit_profile: "double_enter"
      newline_policy: "preserve"
      notes: "FAIL-6: model/effort 'default' is GLOBAL, not per-session. Menus are driven by type-ahead slash commands or launch flags, never arrow/nav keys (unusable through cmux send-key)."
    - harness_id: droid
      version_pin: "0.144.2+"
      harness_version: "0.144.2+"
      quit_verb: "/quit"
      open_menu_recipe: "type-ahead slash commands: /model, /quit"
      model_set_recipe: "--model <name> launch flag or /model (session)"
      effort_set_recipe: "--auto high for mission/high-autonomy (launch flag)"
      relaunch_recipe: "relaunch with --model <name> and --auto high; re-verify autonomy level"
      control_recipe: "clear-before-send: ctrl+u then read-screen; quit: /quit; autonomy: --auto high for mission/high-autonomy"
      submit_profile: "double_enter"
      newline_policy: "preserve"
      notes: "Governed readiness needs `droid mcp`; mission/high-autonomy requires --auto high. Menus via type-ahead slash commands or launch flags, never arrow/nav keys (unusable through cmux send-key)."
    - harness_id: opencode
      version_pin: "1.17.4+"
      harness_version: "1.17.4+"
      quit_verb: "/exit"
      open_menu_recipe: "type-ahead slash commands: /model, /effort, /exit"
      model_set_recipe: "/model <name> (type-ahead)"
      effort_set_recipe: "/effort <level> (type-ahead)"
      relaunch_recipe: "relaunch with --model <name> launch flag; re-verify model from the status bar"
      control_recipe: "clear-before-send: ctrl+u then read-screen; quit: /exit; single-Enter submit, no blind second Enter"
      submit_profile: "single_enter_verify"
      newline_policy: "preserve"
      notes: "single-Enter submit; a blind second Enter interrupts reply generation. Menus via type-ahead slash commands or launch flags, never arrow/nav keys (unusable through cmux send-key)."
    - harness_id: crush
      version_pin: "0.76.0+"
      harness_version: "0.76.0+"
      quit_verb: "/q"
      open_menu_recipe: "type-ahead slash commands: /model, /effort, /q"
      model_set_recipe: "/model <name> (type-ahead)"
      effort_set_recipe: "/effort <level> (type-ahead)"
      relaunch_recipe: "relaunch with --model <name> launch flag; re-verify model from the status bar"
      control_recipe: "clear-before-send: ctrl+u then read-screen; quit: /q; alt-screen TUI, no scrollback — behavioral delivery verification mandatory"
      submit_profile: "double_enter"
      newline_policy: "preserve"
      notes: "Alt-screen TUI with no scrollback: marker-grep is structurally unreliable; behavioral delivery verification is MANDATORY (see transport_contract.alt_screen_rule). Menus via type-ahead slash commands or launch flags, never arrow/nav keys (unusable through cmux send-key)."
    - harness_id: pi
      version_pin: "0.79.6+"
      harness_version: "0.79.6+"
      quit_verb: "/exit"
      open_menu_recipe: "type-ahead slash commands: /model, /exit"
      model_set_recipe: "/model <name> (type-ahead)"
      effort_set_recipe: "N/A (model/effort set via /model)"
      relaunch_recipe: "relaunch with --model <name> launch flag; re-verify model from the status bar"
      control_recipe: "clear-before-send: ctrl+u then read-screen; quit: /exit; single_line_flatten — flatten newlines to spaces with ' ;; ' separators before single submit"
      submit_profile: "single_line_flatten"
      newline_policy: "flatten_to_space"
      notes: "Embedded newlines machine-gun (one line per prompt; GLM-5.2/Pi 2026-06-27 incident) — flatten before single submit. Menus via type-ahead slash commands or launch flags, never arrow/nav keys (unusable through cmux send-key). Central to the single_line_flatten contract."
  submit_profile: single_line_flatten | double_enter | single_enter_verify
  newline_policy: flatten_to_space | preserve

  transport_contract:
    courier: >-
      All loop-to-terminal I/O routes through a pane-resident courier: the
      multiplexer drops orphaned background clients (SIGPIPE / exit 141), so a
      detached writer silently loses messages.
    delivery_verification_tiers:
      - tier_1_scrollback_grep: grep deep scrollback for the message marker
      - tier_2_timed_reread: read the screen again after a bounded delay
      - tier_3_behavioral: screen advanced vs pre-send snapshot AND the message
          head is absent from the input bar
    alt_screen_rule: >-
      Alt-screen TUIs with no scrollback (Crush) make marker-grep structurally
      unreliable — the behavioral tier is MANDATORY there; marker-grep may never
      be the sole verification method for an alt-screen surface.

  upstream_flags:
    cmux_send_key_nav_tokens: >-
      OPEN upstream ask (possibly outside this repo): cmux send-key has no
      arrow/nav-key tokens. The arrow-free contract above stands regardless of
      whether upstream adds them.

  open_questions:
    - question: "Should upstream cmux add arrow/nav-key tokens to send-key?"
      status: OPEN
      impact: "Without nav-token support, all harness control recipes must be arrow-free (type-ahead, mnemonic keys, or launch flags). This is a hard constraint on the control matrix."
      odin_position: "ODIN ships the arrow-free contract regardless; this question is tracked for potential upstream cmux relief."
    - question: "Do vim-style single-letter nav keys (j/k/h/l) work through cmux send-key as text input to TUIs that accept them?"
      status: OPEN
      impact: "Some TUIs accept j/k/h/l as nav keys; sending them as text via cmux may or may not trigger navigation. validateControlRecipe rejects these as nav-key tokens to stay safe."
      odin_position: "Rejected in recipes until verified on a disposable surface; the arrow-free contract applies to all nav-key tokens."
